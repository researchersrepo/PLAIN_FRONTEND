<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Wallet</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
    box-sizing: border-box;
  }

  #connectWalletBtn {
    background: linear-gradient(135deg, #6a5cff, #4a3fd6);
    color: #fff;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(106, 92, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #connectWalletBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(106, 92, 255, 0.45);
  }

  #connectWalletBtn:active {
    transform: translateY(0);
  }

  #connectWalletBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ===== DEBUG BLOCK START ===== */
  /* Remove this entire block (and #debugPanel div below) before production */
  #debugPanel {
    margin-top: 24px;
    width: 100%;
    max-width: 480px;
    background: #1a1d29;
    border: 1px solid #2e3142;
    border-radius: 10px;
    padding: 14px;
    color: #9fe870;
    font-family: monospace;
    font-size: 13px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  /* ===== DEBUG BLOCK END ===== */
</style>
</head>
<body>

<button id="connectWalletBtn">Connect Wallet</button>

<!-- ===== DEBUG BLOCK START (remove before production) ===== -->
<div id="debugPanel">Debug log will appear here...</div>
<!-- ===== DEBUG BLOCK END ===== -->

<script src="connect.js"></script>
</body>
</html>
